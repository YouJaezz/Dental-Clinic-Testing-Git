x-app-build: &app-build
  context: .
  args:
    NODE_VERSION: ${NODE_VERSION:-24-alpine}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *app-build
    restart: "no"
    command: ["npx", "tsx", "./src/db/migrate.pg.ts"]
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  migrate-app:
    build: *app-build
    restart: "no"
    command: ["npx", "tsx", "./src/db/migrate.ts"]
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: *app-build
    restart: unless-stopped
    command: ["node", "./dist/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      NODE_ENV: production
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HEALTH_CHECK_SECRET: ${HEALTH_CHECK_SECRET}
    env_file:
      - .env
    expose:
      - "4321"
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-app:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4321/api/health',{headers:{Authorization:'Bearer '+process.env.HEALTH_CHECK_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_DIR:-./nginx}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CONFIG_DIR:-./nginx}/conf.d:/etc/nginx/conf.d:ro
      - ${NGINX_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
